# ==============================================================================
# Hyprlock Configuration (Strict Square / OLED Monochrome)
# ==============================================================================

# Static OLED Monochrome Palette
$background = rgb(000000)
$foreground = rgb(ffffff)
$color0 = rgb(141414)
$color1 = rgb(ef4444)
$color2 = rgb(22c55e)
$color3 = rgb(eab308)
$color4 = rgb(ffffff)
$color5 = rgb(d4d4d4)
$color6 = rgb(a3a3a3)
$color7 = rgb(ffffff)
$color8 = rgb(525252)

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 90
    font_family = Iosevka Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $color6
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# USER PROMPT
label {
    monitor =
    text =   $USER
    color = $color4
    font_size = 15
    font_family = Iosevka Nerd Font Bold
    position = 0, -25
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD (SQUARE / NO ROUNDING)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0
    outer_color = $color4
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = <span foreground="##8e94a8">Password...</span>
    hide_input = false
    rounding = 0
    check_color = $color5
    fail_color = $color1
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -80
    halign = center
    valign = center
}
