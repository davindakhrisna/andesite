# ==============================================================================
# Hyprlock Configuration (Strict Square / No Rounding)
# ==============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = Iosevka Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(166, 173, 200)
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# USER PROMPT
label {
    monitor =
    text =   $USER
    color = rgb(142, 148, 168)
    font_size = 15
    font_family = Iosevka Nerd Font Bold
    position = 0, -25
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD (SQUARE / NO ROUNDING)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(142, 148, 168)
    inner_color = rgb(24, 24, 37)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = <span foreground="##a6adc8">Password...</span>
    hide_input = false
    rounding = 0
    check_color = rgb(203, 166, 247)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -80
    halign = center
    valign = center
}
