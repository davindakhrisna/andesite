general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Screensaver: Play cmatrix after 150s (2.5 mins) of inactivity
listener {
    timeout = 150
    on-timeout = screensaver.sh start
    on-resume = screensaver.sh stop
}

# 2. Lock screen: Stop screensaver and lock session after 300s (5 mins)
listener {
    timeout = 300
    on-timeout = screensaver.sh stop; loginctl lock-session
}

# 3. Screen off (DPMS): Turn off display after 360s (6 mins)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
