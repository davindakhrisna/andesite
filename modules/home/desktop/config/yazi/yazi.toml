# Yazi Configuration

[manager]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1200
max_height = 1500
cache_dir = ""
image_filter = "triangle"
image_quality = 85
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open default" },
]
reveal = [
    { run = 'thunar "$@"', desc = "Reveal in GUI" },
]
