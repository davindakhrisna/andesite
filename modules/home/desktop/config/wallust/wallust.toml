# Wallust Configuration - Flint Theme Engine
# Dynamic color generation from wallpaper

backend = "resized"
color_space = "lab"
palette = "dark16"
check_contrast = true

[templates]
# GTK 3.0 & GTK 4.0 (Libadwaita)
gtk3 = { template = "gtk.css", target = "~/.config/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk.css", target = "~/.config/gtk-4.0/gtk.css" }

# Rofi Launcher Palette
rofi = { template = "colors.rasi", target = "~/.config/rofi/colors.rasi" }

# Kitty Terminal Colors
kitty = { template = "kitty-colors.conf", target = "~/.config/kitty/colors.conf" }

# Hyprland Border Colors
hypr = { template = "hyprland-colors.conf", target = "~/.config/hypr/colors.conf" }

# Dunst Notifications (OSD)
dunst = { template = "dunstrc", target = "~/.config/dunst/dunstrc" }

# Wlogout Power Menu
wlogout = { template = "wlogout.css", target = "~/.config/wlogout/style.css" }

# Btop Resource Monitor
btop = { template = "btop.theme", target = "~/.config/btop/themes/wallust.theme" }

# Yazi File Manager
yazi = { template = "yazi.toml", target = "~/.config/yazi/theme.toml" }

# Quickshell HUD Theme
quickshell = { template = "quickshell.qml", target = "~/.config/quickshell/Stylix.qml" }
