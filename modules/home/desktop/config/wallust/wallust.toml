# ==============================================================================
# Wallust Dynamic Theming Engine (100% System Domination)
# ==============================================================================

backend = "resized"
color_space = "lab"
palette = "dark16"
check_contrast = true

[templates]
# 1. Hyprland Active/Inactive Border Colors
hyprland = { template = "hyprland.lua", target = "~/.cache/wallust/colors.lua" }

# 2. Waybar Top Bar Colors
waybar = { template = "waybar.css", target = "~/.cache/wallust/colors-waybar.css" }
waybar_cfg = { template = "waybar.css", target = "~/.config/waybar/colors-waybar.css" }

# 3. Dunst Notification Daemon Config
dunst = { template = "dunstrc", target = "~/.config/flint/modules/home/desktop/config/dunst/dunstrc" }

# 4. Rofi Application Launcher & Modals Palette
rofi = { template = "rofi.rasi", target = "~/.cache/wallust/colors-rofi.rasi" }
rofi_cfg = { template = "rofi.rasi", target = "~/.config/rofi/colors-rofi.rasi" }

# 5. Kitty Terminal 16 ANSI Palette & UI
kitty = { template = "kitty.conf", target = "~/.cache/wallust/colors-kitty.conf" }
kitty_cfg = { template = "kitty.conf", target = "~/.config/kitty/colors-kitty.conf" }

# 6. SwayOSD HUD Volume & Brightness Colors
swayosd = { template = "swayosd.css", target = "~/.cache/wallust/colors-swayosd.css" }
swayosd_cfg = { template = "swayosd.css", target = "~/.config/swayosd/colors-swayosd.css" }
swayosd_repo = { template = "swayosd.css", target = "~/.config/flint/modules/home/desktop/config/swayosd/colors-swayosd.css" }

# 7. GTK 3 & GTK 4 Universal Styles
gtk3 = { template = "gtk.css", target = "~/.config/gtk-3.0/gtk.css" }
gtk4 = { template = "gtk.css", target = "~/.config/gtk-4.0/gtk.css" }

# 8. Hyprlock Lockscreen Theme
hyprlock = { template = "hyprlock.conf", target = "~/.cache/wallust/colors-hyprlock.conf" }

# 9. Shell & FZF Fuzzy Finder
fzf = { template = "fzf.zsh", target = "~/.cache/wallust/colors-fzf.zsh" }

# 10. Neovim / NVF IDE Base16 Dynamic Colors
neovim = { template = "neovim.lua", target = "~/.cache/wallust/colors-neovim.lua" }

# 11. Btop System Resource Monitor
btop = { template = "btop.theme", target = "~/.config/btop/themes/wallust.theme" }

# 12. Yazi Terminal File Manager
yazi = { template = "yazi.toml", target = "~/.config/yazi/theme.toml" }

# 13. Cava Audio Visualizer
cava = { template = "cava", target = "~/.config/cava/config" }
