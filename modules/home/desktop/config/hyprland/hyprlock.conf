# Hyprlock Configuration - Flint Theme
# Maximum performance & zero-lag configuration for Nvidia/Wayland

source = ~/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 0
}

# TIME (Hours & Minutes)
label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 80
    font_family = Iosevka Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:86400000] date +"%A, %d %B %Y"
    color = rgb(a6adc8)
    font_size = 18
    font_family = Iosevka Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $activeBorder
    inner_color = rgb(18, 18, 27)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    rounding = 0
    check_color = rgb(137, 220, 235)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 0
    position = 0, -40
    halign = center
    valign = center
}
